<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="N · Training">
<title>Nida — Training</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060a;--s1:#0f0d13;--s2:#171522;--s3:#1e1b28;
  --border:#21192e;--b2:#190f24;
  --text:#ede6f5;--dim:#574d6a;--muted:#2e2640;
  --acc:#f472b6;--acc2:#ec4899;--acc3:#be185d;
  --d1c:#fb923c;--d2c:#c084fc;--d3c:#34d399;
  --font-display:'Bebas Neue',Impact,sans-serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'DM Mono','Courier New',monospace;
  --font-cursive:'Dancing Script',cursive;
}
html{background:var(--bg);height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ── HEADER ─────────────────────────────── */
.app-header{
  position:sticky;top:0;z-index:200;
  background:rgba(6,6,10,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top);
}
.hdr-inner{
  display:flex;align-items:center;gap:13px;
  padding:12px 17px 10px;
}
.n-mark{
  position:relative;width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#f472b6 0%,#be185d 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 28px rgba(244,114,182,.45),0 0 10px rgba(244,114,182,.2);
}
.n-mark::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  background:transparent;border:1px solid rgba(244,114,182,.25);
}
.n-letter{font-family:var(--font-cursive);font-size:32px;color:#fff;line-height:1;margin-top:-2px}
.hdr-text{flex:1;min-width:0}
.hdr-name{font-family:var(--font-display);font-size:26px;letter-spacing:.1em;color:#fff;line-height:1}
.hdr-sub{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.wk-pill{
  font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;flex-shrink:0;
  background:rgba(244,114,182,.1);border:1px solid rgba(244,114,182,.22);color:var(--acc);
}

/* ── TAB BAR ─────────────────────────────── */
.tab-bar{
  display:flex;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.tab-bar::-webkit-scrollbar{display:none}
.t-btn{
  flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;
  padding:9px 14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:all .2s;
}
.t-label{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .2s}
.t-pips{display:flex;gap:3px;height:5px;align-items:center}
.t-pip{width:5px;height:5px;border-radius:50%;background:var(--muted);transition:all .2s}
.t-btn.on .t-label{color:var(--acc)}
.t-btn.on{border-bottom-color:var(--acc);background:rgba(244,114,182,.09)}
.t-btn.on-d1 .t-label{color:var(--d1c)}
.t-btn.on-d1{border-bottom-color:var(--d1c);background:rgba(251,146,60,.09)}
.t-btn.on-d2 .t-label{color:var(--d2c)}
.t-btn.on-d2{border-bottom-color:var(--d2c);background:rgba(192,132,252,.09)}
.t-btn.on-d3 .t-label{color:var(--d3c)}
.t-btn.on-d3{border-bottom-color:var(--d3c);background:rgba(52,211,153,.09)}

/* ── MAIN ─────────────────────────────── */
.app-main{padding-bottom:calc(48px + env(safe-area-inset-bottom))}

/* ── SECTION LABEL ─────────────────────── */
.slabel{display:flex;align-items:center;gap:8px;padding:16px 17px 8px}
.slbar{width:2px;height:13px;border-radius:2px;flex-shrink:0;background:var(--acc)}
.sltxt{font-family:var(--font-mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}

/* ── OVERVIEW ─────────────────────────── */
.ov-hero{
  padding:20px 17px 16px;
  background:linear-gradient(180deg,rgba(244,114,182,.07) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
}
.ov-greet{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.ov-name{font-family:var(--font-cursive);font-size:44px;color:var(--acc);line-height:1.1}
.ov-sub{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:5px}

.up-next-card{
  margin:0 17px;border-radius:13px;padding:16px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:opacity .15s;
}
.up-next-card:active{opacity:.85}
.un-left{flex:1;min-width:0}
.un-eye{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.un-name{font-family:var(--font-display);font-size:28px;letter-spacing:.04em;line-height:1.1;color:#fff}
.un-meta{font-size:11px;color:#666;margin-top:3px}
.un-arrow{font-size:24px;opacity:.4;flex-shrink:0}

.week-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 17px 4px}
.wc{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px 10px;cursor:pointer;transition:border-color .2s;-webkit-tap-highlight-color:transparent}
.wc:active{opacity:.85}
.wc-label{font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.wc-pct{font-family:var(--font-display);font-size:28px;letter-spacing:.04em;line-height:1;margin-bottom:5px}
.wc-bar-bg{height:3px;border-radius:2px;background:var(--muted);overflow:hidden}
.wc-bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.wc-count{font-family:var(--font-mono);font-size:9px;color:var(--dim);margin-top:5px}

.phase-timeline{
  margin:0 17px;background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;
}
.pt-track{display:flex;overflow-x:auto;scrollbar-width:none}
.pt-track::-webkit-scrollbar{display:none}
.pt-step{
  flex:1;min-width:68px;padding:11px 9px;text-align:center;
  border-right:1px solid var(--b2);position:relative;
}
.pt-step:last-child{border-right:none}
.pt-step.cur{background:rgba(244,114,182,.07)}
.pt-num{font-family:var(--font-mono);font-size:8px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.pt-wt{font-size:11px;font-weight:600;margin-top:3px;line-height:1.3}
.pt-dur{font-size:9px;color:var(--dim);margin-top:2px}
.pt-step.cur .pt-wt{color:var(--acc)}
.pt-dot{
  position:absolute;top:7px;right:7px;
  width:6px;height:6px;border-radius:50%;background:var(--acc);
}
.pt-body{padding:12px 14px;border-top:1px solid var(--b2)}
.pt-phase-label{font-family:var(--font-mono);font-size:9px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.pt-phase-desc{font-size:12px;color:#888;line-height:1.6}

.daily-targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 17px 4px}
.dt-card{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:12px 10px;text-align:center}
.dt-val{font-family:var(--font-display);font-size:26px;letter-spacing:.04em;line-height:1;margin-bottom:4px}
.dt-label{font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

.rule-pill{
  margin:0 17px 16px;padding:12px 14px;border-radius:10px;
  background:rgba(244,114,182,.06);border:1px solid rgba(244,114,182,.15);
}
.rule-pill-eye{font-family:var(--font-mono);font-size:9px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.rule-pill-txt{font-size:12px;color:#999;line-height:1.6}

/* ── DAY HEADER ─────────────────────────── */
.day-hdr{padding:18px 17px 14px;border-bottom:1px solid var(--border)}
.day-title-row{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.day-stripe{width:4px;border-radius:3px;align-self:stretch;flex-shrink:0;min-height:36px}
.day-name{font-family:var(--font-display);font-size:30px;letter-spacing:.04em;line-height:1;color:#fff}
.day-focus{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.day-dur{font-family:var(--font-display);font-size:22px;letter-spacing:.04em;flex-shrink:0;align-self:flex-start;margin-top:4px}
.day-prog-bg{height:3px;border-radius:2px;background:var(--muted);overflow:hidden}
.day-prog-fill{height:100%;border-radius:2px;transition:width .3s ease}
.day-prog-labels{display:flex;justify-content:space-between;margin-top:5px}
.dpl-a{font-family:var(--font-mono);font-size:9px}
.dpl-b{font-family:var(--font-mono);font-size:9px;color:var(--dim)}

/* ── STATION ─────────────────────────────── */
.station{margin:12px 17px 0}
.station-hdr{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:9px 9px 0 0;
  background:var(--s2);border:1px solid var(--border);border-bottom:none;
}
.s-icon{font-size:14px}
.s-name{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;flex:1}
.s-count{font-family:var(--font-mono);font-size:9px;color:var(--dim);margin-left:auto}
.station-body{border:1px solid var(--border);border-radius:0 0 9px 9px;overflow:hidden}

/* ── EXERCISE ROW ─────────────────────────── */
.ex-row{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;border-bottom:1px solid var(--b2);
  cursor:pointer;transition:background .12s;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.ex-row:last-child{border-bottom:none}
.ex-row:active{background:var(--s3)}
.ex-chk{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--muted);
  transition:all .2s cubic-bezier(.4,0,.2,1);
}
.ex-row.done .ex-chk{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px rgba(244,114,182,.4)}
.chk-svg{display:none;width:12px;height:12px}
.ex-row.done .chk-svg{display:block}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.3;transition:all .2s}
.ex-row.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-note{font-size:10px;color:#2e2440;font-style:italic;margin-top:2px;line-height:1.4}
.ex-meta{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:2px;transition:color .2s}
.ex-row.done .ex-meta{color:var(--muted);opacity:.4}
.ex-wt{
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  padding:3px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0;
}

/* ── COMPLETION BANNER ─────────────────────── */
.done-banner{
  margin:16px 17px;padding:20px;text-align:center;border-radius:13px;
}
.done-title{font-family:var(--font-cursive);font-size:38px;line-height:1.1}
.done-sub{font-size:12px;color:#777;margin-top:5px}

/* ── NUTRITION ─────────────────────────── */
.nut-hero{
  padding:20px 17px 16px;
  background:linear-gradient(180deg,rgba(244,114,182,.07) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
}
.nut-title{font-family:var(--font-cursive);font-size:38px;color:var(--acc);margin-bottom:4px}
.nut-sub{font-size:12px;color:#888;line-height:1.6}

.phase-table{margin:0 17px 10px;background:var(--s1);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.pt-row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--b2)}
.pt-row:last-child{border-bottom:none}
.pt-row.cur{background:rgba(244,114,182,.05)}
.pt-ph{font-family:var(--font-mono);font-size:9px;font-weight:700;min-width:36px;letter-spacing:.08em}
.pt-info{flex:1;font-size:11px;color:#777}
.pt-nums{font-family:var(--font-mono);font-size:9px;text-align:right;line-height:1.6}

.acc-card{
  margin:0 17px 9px;background:var(--s1);border:1px solid var(--border);border-radius:11px;overflow:hidden;
}
.acc-hdr{
  display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.acc-icon{font-size:14px}
.acc-title{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.acc-chev{font-size:10px;color:var(--dim);transition:transform .2s;flex-shrink:0}
.acc-card.open .acc-chev{transform:rotate(180deg)}
.acc-body{display:none;padding:12px 14px 14px;border-top:1px solid var(--b2)}
.acc-card.open .acc-body{display:block}
.acc-body p{font-size:12px;color:#888;line-height:1.75;margin-bottom:8px}
.acc-body p:last-child{margin-bottom:0}
.acc-body ul{padding-left:15px}
.acc-body li{font-size:12px;color:#888;line-height:1.9}
.acc-body strong{color:#ccc}

.meal-sec-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;margin-top:12px}
.meal-sec-hdr:first-child{margin-top:0}
.meal-sec-name{font-family:var(--font-mono);font-size:9px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.meal-sec-cal{font-family:var(--font-mono);font-size:9px;color:var(--dim)}
.meal-opt{background:var(--s2);border-radius:7px;padding:9px 11px;margin-bottom:6px}
.meal-opt-name{font-size:11px;font-weight:600;color:#ccc;margin-bottom:3px}
.meal-opt-items{font-size:11px;color:#555;line-height:1.9}

.plate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.plate-cell{background:var(--s3);border-radius:7px;padding:9px;text-align:center}
.plate-frac{font-family:var(--font-display);font-size:24px;letter-spacing:.04em;line-height:1}
.plate-name{font-family:var(--font-mono);font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-top:3px}

.rule-row{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--b2)}
.rule-row:last-child{border-bottom:none}
.rule-n{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--acc);min-width:18px;flex-shrink:0;margin-top:1px}
.rule-txt{font-size:12px;color:#888;line-height:1.65}

/* ── HISTORY ─────────────────────────────── */
.hist-hdr{padding:18px 17px 12px;border-bottom:1px solid var(--border)}
.hist-title{font-family:var(--font-display);font-size:32px;letter-spacing:.04em;color:#fff}
.hist-sub{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.reset-info{
  margin:12px 17px;padding:11px 14px;border-radius:9px;
  background:rgba(244,114,182,.05);border:1px solid rgba(244,114,182,.13);
  font-size:11px;color:#777;line-height:1.6;
}
.reset-info strong{color:var(--acc)}
.hist-entry{margin:12px 17px 0;background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:14px}
.hist-wk{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:11px}
.hist-days{display:flex;gap:7px}
.hist-day{flex:1;background:var(--s2);border-radius:9px;padding:10px 8px;text-align:center}
.hist-day-label{font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.hist-day-pct{font-family:var(--font-display);font-size:22px;letter-spacing:.04em;line-height:1}
.hist-day-cnt{font-family:var(--font-mono);font-size:8px;color:var(--dim);margin-top:3px}
.hist-empty{text-align:center;padding:60px 20px}
.hist-empty-ico{font-size:44px;opacity:.25;margin-bottom:12px}
.hist-empty-txt{font-size:13px;color:var(--dim);line-height:1.7}

/* ── UTILS ─────────────────────────────── */
.spacer{height:20px}
@media(max-width:360px){
  .week-cards,.daily-targets{gap:6px}
  .wc-pct,.dt-val{font-size:22px}
  .n-mark{width:40px;height:40px}
  .n-letter{font-size:28px}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="hdr-inner">
    <div class="hdr-text">
      <div class="hdr-name">Nida Zia</div>
      <div class="hdr-sub">Personal Training Program</div>
    </div>
    <div class="wk-pill" id="wk-pill">WK —</div>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
</div>

<div class="app-main" id="app-main"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// WORKOUT DATA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const W = {
  day1:{
    title:'Upper Body & Core', short:'Upper',
    colorVar:'var(--d1c)', colorHex:'#fb923c', time:'~75 min',
    stations:[
      { name:'Bench Station', icon:'🏋️', exs:[
        {id:'d1_bench',    name:'Bench Press',               meta:'3 × 8–12',          wt:'40 lbs'},
        {id:'d1_skull',    name:'Skull Crushers',            meta:'3 × 12',             wt:'17.5 lbs', note:'Tricep variation'},
      ]},
      { name:'Dumbbell Area', icon:'💪', exs:[
        {id:'d1_dbshould', name:'Dumbbell Shoulder Press',   meta:'3 × 8–12',          wt:'15 lbs'},
        {id:'d1_dbrow',    name:'Bent-Over Dumbbell Row',    meta:'3 × 8–12',          wt:'17.5 lbs'},
      ]},
      { name:'Cable & Machines', icon:'⚙️', exs:[
        {id:'d1_rowmach',  name:'Row Machine',               meta:'3 × 8–12',          wt:'70 lbs'},
        {id:'d1_latpull',  name:'Lat Pulldowns',             meta:'3 × 8–12',          wt:'55 lbs'},
        {id:'d1_trpull',   name:'Tricep Pulldown (both arms)',meta:'3 × 12',           wt:'20 lbs'},
        {id:'d1_trpress',  name:'Tricep Press Machine',      meta:'3 × 8–12',          wt:'90 lbs'},
      ]},
      { name:'Functional', icon:'🔥', exs:[
        {id:'d1_tires',    name:'Throwing Tires',            meta:'10 throws',         wt:null},
      ]},
      { name:'Core Circuit', icon:'◎', exs:[
        {id:'d1_hangknee', name:'Hanging Knee Raises',       meta:'3 × 15–25',         wt:null},
        {id:'d1_romanleg', name:'Roman Chair Leg Raises',    meta:'3 × 8–12',          wt:'20 lbs'},
        {id:'d1_plank',    name:'Plank',                     meta:'3 × 30–60 sec',     wt:null},
        {id:'d1_russian',  name:'Russian Twists',            meta:'3 × 15 to failure', wt:null},
        {id:'d1_deadbug',  name:'Dead Bug Toe Taps',         meta:'3 × 10–15/side',   wt:null},
      ]},
      { name:'Finish', icon:'✅', exs:[
        {id:'d1_stretch',  name:'Stretch',                   meta:'Full body',         wt:null},
        {id:'d1_stairs',   name:'Stairmaster',               meta:'10–15 min',         wt:null},
      ]},
    ]
  },
  day2:{
    title:'Lower Body & Glutes', short:'Lower',
    colorVar:'var(--d2c)', colorHex:'#c084fc', time:'~75 min',
    stations:[
      { name:'Barbell / Free Weights', icon:'🏋️', exs:[

// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const KEY = 'nida_training_v1';
let S; // app state

function isoWeek() {
  const n = new Date();
  const d = new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((d - y0) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`;
}

function weekLabel(key) {
  const [yr, wPart] = key.split('-W');
  const wn = parseInt(wPart);
  const jan4 = new Date(parseInt(yr), 0, 4);
  const jan4d = jan4.getDay() || 7;
  const mon = new Date(jan4.getTime() - (jan4d - 1) * 86400000 + (wn - 1) * 7 * 86400000);
  const sun = new Date(mon.getTime() + 6 * 86400000);
  const fmt = d => d.toLocaleDateString('en-CA', {month:'short', day:'numeric'});
  return `${fmt(mon)} – ${fmt(sun)}, ${yr}`;
}

function loadS() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function saveS() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

function initS() {
  const cw = isoWeek();
  const saved = loadS();
  if (!saved) {
    S = { week: cw, checked: {day1:[],day2:[],day3:[]}, history: [] };
  } else if (saved.week !== cw) {
    S = {
      week: cw,
      checked: {day1:[],day2:[],day3:[]},
      history: [{ week: saved.week, checked: saved.checked }, ...(saved.history||[])].slice(0, 52)
    };
  } else {
    S = saved;
    DAYS.forEach(d => { if (!S.checked[d]) S.checked[d] = []; });
  }
  saveS();
}

function pct(day) {
  const t = DAY_TOTALS[day]; if (!t) return 0;
  return Math.round((S.checked[day].length / t) * 100);
}

const TABS = [

  {id:'day3',     label:'FULL'},
  {id:'nutrition',label:'FOOD'},
  {id:'history',  label:'LOG'},
];
let curTab = 'overview';

function goTab(id) {
  curTab = id;
  renderTabBar();
  renderMain();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderTabBar() {
  const wn = isoWeek().split('-W')[1];
  document.getElementById('wk-pill').textContent = `WK ${wn}`;

  document.getElementById('tab-bar').innerHTML = TABS.map(t => {
    const isDay = DAYS.includes(t.id);
    const isOn = t.id === curTab;
    let cls = isOn ? (isDay ? `on-${t.id.replace('day','d')}` : 'on') : '';

    let pips = '';
    if (isDay) {
      const col = W[t.id].colorHex;
      const done = S.checked[t.id].length;
      const total = DAY_TOTALS[t.id];
      pips = `<div class="t-pips">${[0,1,2].map(i => {
        const thr = Math.ceil(total / 3) * (i + 1);
        const fill = done >= thr ? `background:${col}` : '';
        return `<div class="t-pip" style="${fill}"></div>`;
      }).join('')}</div>`;
    }

    return `<button class="t-btn ${cls}" onclick="goTab('${t.id}')">
      <span class="t-label">${t.label}</span>
      ${pips}
    </button>`;
  }).join('');
}

// TOGGLE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleEx(day, id) {
  const arr = S.checked[day];
  const i = arr.indexOf(id);
  if (i === -1) arr.push(id); else arr.splice(i, 1);
  saveS();

  const row = document.getElementById('r-' + id);
  if (row) row.classList.toggle('done', arr.includes(id));

  updateDayProg(day);
  renderTabBar();

  if (pct(day) === 100) {
    const banner = document.getElementById('done-banner-' + day);
    if (banner) banner.style.display = 'block';
  } else {
    const banner = document.getElementById('done-banner-' + day);
    if (banner) banner.style.display = 'none';
  }
}

function updateDayProg(day) {
  const fill = document.getElementById('dpf-' + day);
  const la = document.getElementById('dpl-' + day);
  if (!fill || !la) return;
  const done = S.checked[day].length;
  const total = DAY_TOTALS[day];
  const p = Math.round((done / total) * 100);
  const c = W[day].colorHex;
  fill.style.width = p + '%';
  fill.style.background = c;
  la.innerHTML = `<span class="dpl-a" style="color:${c}">${done} done</span><span class="dpl-b">${total} total</span>`;
}

function renderStations(day) {

        {n:'Chicken Dinner', i:'4–5 oz chicken · roasted potatoes · broccoli · olive oil'},
        {n:'Salmon Dinner', i:'4 oz salmon · ½–¾ cup rice · asparagus or green beans'},
        {n:'Taco Bowl', i:'Lean turkey or beef · black beans · rice · lettuce · salsa · avocado'},
        {n:'Stir-Fry', i:'Chicken or tofu or shrimp · lots of vegetables · rice · lower-sodium sauce'},
      ].map(o=>`<div class="meal-opt"><div class="meal-opt-name">${o.n}</div><div class="meal-opt-items">${o.i}</div></div>`).join('')}
    `),

    nutCard('migraine','⚡','Migraine Protocol',`
      ${[
        {n:'Never intentionally fast', b:'3 meals + 1–2 snacks every day, no exceptions. <strong>No intermittent fasting.</strong> Skipped meals are a leading migraine trigger.'},
        {n:'Hydrate consistently', b:'<strong>2–2.5 L/day minimum.</strong> More on workout days. Carry a water bottle everywhere. Dehydration triggers migraines.'},
        {n:'Keep caffeine consistent', b:"Don't alternate between lots and none. Same amount, same time. Caffeine withdrawal triggers headaches."},
        {n:"Don't eliminate foods in bulk", b:"No universal migraine foods exist. Track triggers in a diary first. Don't restrict unnecessarily."},
        {n:'Migraine days: forget the deficit', b:'Priority order: hydration → treatment → regular food → protein → rest. <strong>Do not punish yourself after.</strong> Never compensate by starving the next day — that cycle makes the next attack more likely.'},
      ].map((r,i) => `<div class="rule-row">
        <div class="rule-n">${i+1}</div>
        <div class="rule-txt"><strong>${r.n}</strong><br>${r.b}</div>
      </div>`).join('')}
    `),

    nutCard('adhd','🧠','ADHD Food System',`
      <p><strong>Default meals.</strong> Have 3 breakfasts, 3 lunches, and 5 dinners you can make without thinking. Eliminate decision fatigue entirely.</p>
      <p><strong>Always keep at home:</strong></p>
      <ul>
        <li>Greek yogurt, protein shakes, eggs</li>
        <li>Frozen vegetables, frozen berries</li>
        <li>Microwave rice, canned tuna/salmon</li>
        <li>Rotisserie chicken, whole-grain wraps, fruit, nuts</li>
      </ul>
      <p style="margin-top:10px"><strong>Minimum viable meal</strong> (bad ADHD/migraine day):</p>
      <ul>
        <li>Protein shake + banana + toast</li>
        <li>Greek yogurt + berries + oats</li>
        <li>Rotisserie chicken + microwave rice + frozen vegetables</li>
        <li>Eggs + toast + fruit</li>
      </ul>
      <p style="margin-top:8px"><em>Infinitely better than accidentally not eating for 10 hours and ordering 2,000 calories because you're starving.</em></p>
    `),

    nutCard('bloodsugar','🩸','Blood Sugar Strategy',`
      <p><strong>Every carb gets a partner.</strong> You don't need to eliminate carbohydrates — just always pair them.</p>
      <div style="display:grid;gap:6px;margin:10px 0">
        ${[
          ['Cereal alone','Cereal + Greek yogurt + berries'],
          ['Toast alone','Toast + eggs + fruit'],
          ['Rice alone','Rice + chicken + vegetables'],
          ['Apple alone','Apple + peanut butter or Greek yogurt'],
        ].map(([no,yes]) => `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <div style="background:rgba(255,80,80,.07);border-radius:7px;padding:8px 10px;font-size:11px;color:#555">✗ ${no}</div>
          <div style="background:rgba(52,211,153,.07);border-radius:7px;padding:8px 10px;font-size:11px;color:#888">✓ ${yes}</div>
        </div>`).join('')}
      </div>
      <p>Prioritize: vegetables · berries · beans/lentils · oats · potatoes · whole grains · Greek yogurt · lean proteins. <strong>You don't need to fear fruit.</strong></p>
    `),

    nutCard('nutrients','💊','Nutrient Focus',`
      <p><strong>Iron:</strong> Include lean beef, chicken, eggs, lentils, beans, tofu, and spinach regularly. Pair plant-based iron with vitamin C (peppers, berries, citrus, tomatoes) for better absorption. If prescribed iron, follow clinician timing exactly. Don't self-dose.</p>
      <p><strong>B12:</strong> Fish, meat, eggs, dairy, fortified foods. Food alone won't correct a documented deficiency — supplementation matters. Continue whatever your clinician recommended.</p>
      <p><strong>Vitamin D:</strong> Fatty fish, fortified dairy or plant beverages, eggs. Supplementation is typically required to correct deficiency, especially in Ottawa winters. Follow your clinician's dose.</p>
      <p><strong>Medical checklist</strong> to discuss with your doctor: CBC · ferritin · iron/TIBC · B12 · folate · 25-OH Vitamin D · A1C · fasting glucose · TSH if appropriate</p>
    `),

    nutCard('scorecard','📊','Monthly Scorecard',`
      <p>Track these monthly — the scale is only one measurement:</p>
      <ul>
        <li><strong>Body:</strong> Average weight + waist circumference</li>
        <li><strong>Metabolic:</strong> A1C when clinician recommends · fasting glucose</li>
        <li><strong>Nutrition:</strong> Average protein · meal adherence</li>
        <li><strong>Migraine:</strong> Days per month · severity · suspected triggers · medication use</li>
        <li><strong>Fitness:</strong> Strength gains · step count · cardio</li>
        <li><strong>Labs:</strong> Ferritin/iron · B12 · Vitamin D</li>
      </ul>
      <p style="margin-top:8px"><em>Progress on metabolic markers and migraine frequency matter as much as the number on the scale.</em></p>
    `),
  ];

  return `
    <div class="nut-hero">
      <div class="nut-title">Nutrition</div>
      <div class="nut-sub">Phase 1 · 1,550–1,650 cal · 100–110g protein daily<br>3 meals + 1–2 snacks. No intermittent fasting. No skipping.</div>
    </div>

    <div class="slabel"><div class="slbar"></div><div class="sltxt">Phase Calorie Guide</div></div>
    <div class="phase-table">
      ${[
        {ph:'PH 0', info:'Foundation · Wks 0–2',       cal:'1,550–1,650', prot:'100–110g'},
        {ph:'PH 1', info:'139→132 lbs · current',      cal:'1,550–1,650', prot:'100–110g', cur:true},
        {ph:'PH 2', info:'132→125 lbs',                cal:'1,500–1,600', prot:'100–110g'},
        {ph:'PH 3', info:'125→120 lbs',                cal:'1,400–1,500', prot:'95–110g'},
        {ph:'PH 4', info:'120→114 lbs · optional',     cal:'1,350–1,400', prot:'95–115g'},
      ].map(r=>`<div class="pt-row${r.cur?' cur':''}">
        <div class="pt-ph" style="color:${r.cur?'var(--acc)':'var(--dim)'}">${r.ph}</div>
        <div class="pt-info" style="color:${r.cur?'#ccc':'#777'}">${r.info}</div>
        <div class="pt-nums" style="color:${r.cur?'var(--acc)':'#555'}">${r.cal}<br>${r.prot}</div>
      </div>`).join('')}
    </div>

    <div class="slabel"><div class="slbar"></div><div class="sltxt">Daily Targets — Phase 1</div></div>
    <div class="daily-targets" style="margin-bottom:12px">
      <div class="dt-card">
        <div class="dt-val" style="color:var(--acc)">1,600</div>
        <div class="dt-label">Calories</div>
      </div>
      <div class="dt-card">
        <div class="dt-val" style="color:var(--d1c)">105g</div>
        <div class="dt-label">Protein</div>
      </div>
      <div class="dt-card">
        <div class="dt-val" style="color:var(--d2c)">160g</div>
        <div class="dt-label">Carbs</div>
      </div>
    </div>

    <div style="padding:0 17px 4px">
      ${cards.join('')}
    </div>
    <div class="spacer"></div>`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER: HISTORY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderHistory() {
  const hist = S.history;

  let entries = hist.length === 0
    ? `<div class="hist-empty">
        <div class="hist-empty-ico">📅</div>
        <div class="hist-empty-txt">No completed weeks yet.<br>Finish your first week to see your history here.<br><br>Your checklist resets every Monday — your data is preserved here automatically.</div>
      </div>`
    : hist.map(e => `
      <div class="hist-entry">
        <div class="hist-wk">Week of ${weekLabel(e.week)}</div>
        <div class="hist-days">
          ${DAYS.map(d => {
            const dw = W[d];
            const done = (e.checked[d]||[]).length;
            const total = DAY_TOTALS[d];
            const p = Math.round((done/total)*100);
            return `<div class="hist-day" style="border:1px solid ${ha(dw.colorHex,0.2)}">
              <div class="hist-day-label" style="color:${dw.colorHex}">${dw.short}</div>
              <div class="hist-day-pct" style="color:${p>0?dw.colorHex:'var(--muted)'}">${p}%</div>
              <div class="hist-day-cnt">${done}/${total}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`).join('');

  return `
    <div class="hist-hdr">
      <div class="hist-title">History</div>
      <div class="hist-sub">Auto-resets every Monday · Progress always preserved</div>
    </div>
    <div class="reset-info">
      Your checklist resets automatically every <strong>Monday morning</strong>. Each completed week is archived here and <strong>never erased.</strong>
    </div>
    ${entries}
    <div class="spacer"></div>`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MAIN RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderMain() {
  const el = document.getElementById('app-main');
  switch(curTab) {
    case 'overview':  el.innerHTML = renderOverview(); break;
    case 'day1':      el.innerHTML = renderDay('day1'); break;
    case 'day2':      el.innerHTML = renderDay('day2'); break;
    case 'day3':      el.innerHTML = renderDay('day3'); break;
    case 'nutrition': el.innerHTML = renderNutrition(); break;
    case 'history':   el.innerHTML = renderHistory(); break;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// APP ICON
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setAppIcon() {
  try {
    const c = document.createElement('canvas');
    c.width = 180; c.height = 180;
    const ctx = c.getContext('2d');
    // Pink background
    ctx.fillStyle = '#f472b6';
    ctx.fillRect(0, 0, 180, 180);
    // White cursive N
    ctx.fillStyle = '#ffffff';
    ctx.font = 'italic bold 128px Georgia,serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('N', 90, 96);
    // Set as apple-touch-icon
    let lnk = document.querySelector('link[rel="apple-touch-icon"]');
    if (!lnk) {
      lnk = document.createElement('link');
      lnk.rel = 'apple-touch-icon';
      document.head.appendChild(lnk);
    }
    lnk.href = c.toDataURL('image/png');
  } catch(e) {}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BOOT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
setAppIcon();
initS();
renderTabBar();
renderMain();
</script>
